<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Тапи - Тап P2P — Защищенный мессенджер</title>
    <!-- PeerJS (сигнальный сервер для P2P) -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-panel {
            background: rgba(30, 30, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .glass-sidebar {
            background: rgba(15, 15, 18, 0.9);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .glass-input:focus {
            outline: none;
            border-color: #F97316;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .blob-blue { background-color: #4285F4; }
        .blob-orange { background-color: #F97316; }
        .nav-btn {
            background: rgba(249, 115, 22, 0.9);
            color: #000;
            border: 1px solid rgba(0,0,0,0.5);
            transition: all 0.2s;
        }
        .nav-btn:hover {
            background: rgba(249, 115, 22, 1);
            transform: translateY(-1px);
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
            background: rgba(255, 255, 255, 0.08);
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }
        .message.self {
            align-self: flex-end;
            background: #F97316;
            color: #000;
            border-bottom-right-radius: 6px;
        }
        .microphone-btn.recording {
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body class="bg-[#0a0a0c] text-gray-200 font-sans h-screen overflow-hidden relative selection:bg-orange-500 selection:text-white flex flex-col">

    <!-- Фоновые градиенты (дизайн-концепция) -->
    <div class="fixed top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full blob-blue mix-blend-screen filter blur-[120px] opacity-20"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[50vw] h-[50vw] rounded-full blob-orange mix-blend-screen filter blur-[140px] opacity-15"></div>

    <!-- Шапка платформы с 7 фирменными кнопками -->
    <header class="border-b border-white/10 px-6 py-3 flex flex-col xl:flex-row justify-between items-center gap-4 bg-black/50 backdrop-blur-md z-50 shrink-0">
        <div class="text-white text-2xl font-black tracking-tighter cursor-pointer flex items-center gap-3" onclick="location.reload()">
            Тапи - <span class="text-orange-500">Тап</span>
            <span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono">🔒 P2P E2EE</span>
        </div>
        <nav class="flex flex-wrap justify-center gap-2">
            <button class="nav-btn font-bold rounded-lg px-3 py-1.5 text-xs">купить</button>
            <button class="nav-btn font-bold rounded-lg px-3 py-1.5 text-xs">продать</button>
            <button class="nav-btn font-bold rounded-lg px-3 py-1.5 text-xs">сотрудничество</button>
            <button class="nav-btn font-bold rounded-lg px-3 py-1.5 text-xs">обратиться к команде</button>
            <button class="nav-btn font-bold rounded-lg px-3 py-1.5 text-xs">поддержать команду</button>
            <button class="bg-white text-black font-bold rounded-lg px-3 py-1.5 text-xs flex items-center gap-1.5 border border-black shadow">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                Tapi - Tap
            </button>
            <button class="nav-btn font-bold rounded-lg px-3 py-1.5 text-xs">страхование</button>
        </nav>
    </header>

    <!-- Панель статуса соединения и подключения к Peer ID -->
    <div class="bg-black/60 border-b border-white/10 px-6 py-2.5 flex flex-wrap items-center justify-between gap-4 z-40 text-xs">
        <div class="flex items-center gap-3">
            <span class="text-gray-400">Ваш Peer ID:</span>
            <span id="my-peer-id" class="font-mono text-orange-400 bg-black/40 px-3 py-1 rounded-md border border-white/10 select-all">Генерация...</span>
            <span id="conn-status" class="px-2.5 py-1 rounded-md bg-red-500/20 text-red-400 border border-red-500/30">⛔ Не подключено</span>
        </div>
        <div class="flex items-center gap-2">
            <input type="text" id="remote-peer-input" placeholder="Введите ID собеседника..." class="glass-input px-3 py-1.5 rounded-lg text-xs w-48 md:w-64">
            <button id="connect-btn" class="bg-orange-500 text-black font-bold px-4 py-1.5 rounded-lg hover:bg-orange-400 transition">Подключиться</button>
            <button id="disconnect-btn" class="hidden bg-gray-700 text-white font-bold px-4 py-1.5 rounded-lg hover:bg-gray-600 transition">Отключить</button>
        </div>
    </div>

    <!-- Основное окно мессенджера -->
    <main class="flex-1 flex w-full max-w-[1700px] mx-auto relative z-10 p-3 md:p-5 gap-3 h-[calc(100vh-130px)] overflow-hidden">
        
        <div class="glass-panel w-full rounded-2xl flex overflow-hidden shadow-2xl h-full relative">
            
            <!-- Левая панель: Чаты -->
            <div class="glass-sidebar w-80 hidden md:flex flex-col shrink-0">
                <div class="p-4 border-b border-white/5">
                    <input type="text" placeholder="Поиск по сделкам..." class="glass-input w-full rounded-lg px-3 py-2 text-xs">
                </div>
                <div class="flex-1 overflow-y-auto divide-y divide-white/5">
                    <div class="p-4 bg-white/5 cursor-pointer border-l-2 border-orange-500">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-xs font-bold text-white">Активная сессия P2P</span>
                            <span class="text-[10px] text-emerald-400 font-mono">Secure</span>
                        </div>
                        <p class="text-xs text-gray-400 truncate">Шифрование ключом устройства</p>
                    </div>
                </div>
            </div>

            <!-- Правая панель: Рабочая зона чата -->
            <div class="flex-1 flex flex-col bg-black/20 relative">
                
                <!-- Шапкa чата -->
                <div class="p-4 border-b border-white/10 flex justify-between items-center bg-black/40 shrink-0">
                    <div class="flex items-center gap-3">
                        <div class="w-9 h-9 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center font-bold text-sm">P2P</div>
                        <div>
                            <h3 class="text-sm font-bold text-white">Защищенный узел связи <span class="text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded ml-2">Direct</span></h3>
                            <p class="text-[10px] text-gray-400">Данные не сохраняются на центральных серверах</p>
                        </div>
                    </div>
                    
                    <!-- Кнопки звонков -->
                    <div class="flex gap-2">
                        <button id="call-audio-btn" class="bg-white/10 hover:bg-white/20 text-white px-3 py-2 rounded-xl transition flex items-center gap-1.5 text-xs font-medium">
                            <svg class="w-4 h-4 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                            <span>Аудио</span>
                        </button>
                        <button id="call-video-btn" class="bg-orange-500 hover:bg-orange-400 text-black px-3 py-2 rounded-xl transition flex items-center gap-1.5 text-xs font-bold">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <span>Видео</span>
                        </button>
                    </div>
                </div>

                <!-- Блок истории сообщений -->
                <div id="chat-container" class="flex-1 p-6 overflow-y-auto space-y-4 flex flex-col">
                    <div class="flex justify-center">
                        <span class="text-[10px] bg-white/5 text-gray-400 px-3 py-1 rounded-full">⚡ Введите ID собеседника вверху и подключитесь, чтобы начать сессию</span>
                    </div>
                </div>

                <!-- Интерактивная панель ввода -->
                <div class="p-4 border-t border-white/10 bg-black/40 shrink-0 flex items-center gap-3">
                    <button class="text-gray-400 hover:text-white p-2" id="file-btn" title="Прикрепить файл">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                    </button>
                    <input type="file" id="file-input" class="hidden" multiple />
                    
                    <button class="text-gray-400 hover:text-orange-400 p-2 microphone-btn" id="voice-btn" title="Записать голосовое (удерживайте)">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    </button>

                    <input type="text" id="msg-input" placeholder="Сообщение..." class="glass-input flex-1 rounded-xl px-4 py-2.5 text-xs">
                    
                    <button class="bg-orange-500 hover:bg-orange-400 text-black font-bold px-5 py-2.5 rounded-xl text-xs transition" id="send-btn">
                        Отправить
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Оверлей звонка (Glassmorphism) -->
    <div class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex-col items-center justify-center p-4" id="call-overlay">
        <div class="relative w-full max-w-lg h-[60vh] bg-black/60 rounded-3xl overflow-hidden border border-white/10 flex items-center justify-center mb-6">
            <video class="w-full h-full object-cover" id="remote-video" autoplay playsinline></video>
            <video class="absolute bottom-4 right-4 w-32 h-24 rounded-xl object-cover border-2 border-orange-500 bg-gray-900 shadow-xl" id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="flex gap-4">
            <button id="end-call-btn" class="bg-red-600 hover:bg-red-500 text-white font-bold px-8 py-3 rounded-xl text-xs transition shadow-lg">Завершить</button>
            <button id="accept-call-btn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3 rounded-xl text-xs transition shadow-lg">Принять</button>
        </div>
    </div>

    <!-- Логика PeerJS / P2P -->
    <script>
        const peer = new Peer(undefined, { debug: 1 });

        let myId = '';
        let currentConn = null;
        let currentCall = null;
        let localStream = null;
        let remoteStream = null;

        const $ = id => document.getElementById(id);
        const chat = $('chat-container');
        const myIdSpan = $('my-peer-id');
        const connStatus = $('conn-status');
        const remoteInput = $('remote-peer-input');
        const connectBtn = $('connect-btn');
        const disconnectBtn = $('disconnect-btn');
        const msgInput = $('msg-input');
        const sendBtn = $('send-btn');
        const fileBtn = $('file-btn');
        const fileInput = $('file-input');
        const voiceBtn = $('voice-btn');
        const callAudioBtn = $('call-audio-btn');
        const callVideoBtn = $('call-video-btn');
        const callOverlay = $('call-overlay');
        const remoteVideo = $('remote-video');
        const localVideo = $('local-video');
        const endCallBtn = $('end-call-btn');
        const acceptCallBtn = $('accept-call-btn');

        peer.on('open', (id) => {
            myId = id;
            myIdSpan.textContent = id;
            addSystemMessage('Узел инициализирован. Ваш ID выведен сверху.');
        });

        peer.on('error', (err) => {
            addSystemMessage('Ошибка сети P2P: ' + err.type);
        });

        peer.on('connection', (conn) => {
            if (currentConn) {
                conn.close();
                return;
            }
            setupConnection(conn);
            addSystemMessage('📞 Входящее соединение установлено от узла: ' + conn.peer);
        });

        peer.on('call', (call) => {
            if (currentCall) {
                call.answer();
                call.close();
                return;
            }
            callOverlay.classList.remove('hidden');
            callOverlay.classList.add('flex');
            acceptCallBtn.classList.remove('hidden');
            endCallBtn.textContent = 'Отклонить';
            currentCall = call;

            acceptCallBtn.onclick = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: call.metadata?.type === 'video' });
                    localStream = stream;
                    localVideo.srcObject = stream;
                    call.answer(stream);
                    call.on('stream', (remote) => {
                        remoteStream = remote;
                        remoteVideo.srcObject = remote;
                    });
                    call.on('close', () => endCall());
                    acceptCallBtn.classList.add('hidden');
                    endCallBtn.textContent = 'Завершить';
                    addSystemMessage('🔊 Защищенный звонок начат');
                } catch (e) {
                    alert('Нет доступа к камере/микрофону: ' + e.message);
                    endCall();
                }
            };
        });

        function setupConnection(conn) {
            currentConn = conn;
            connStatus.textContent = '✅ Подключено (P2P)';
            connStatus.className = 'px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
            connectBtn.classList.add('hidden');
            disconnectBtn.classList.remove('hidden');
            remoteInput.disabled = true;

            conn.on('data', (data) => {
                try {
                    const parsed = JSON.parse(data);
                    if (parsed.type === 'text') {
                        addMessage(parsed.text, false);
                    } else if (parsed.type === 'file') {
                        const blob = base64ToBlob(parsed.data, parsed.mimeType);
                        const url = URL.createObjectURL(blob);
                        addFileMessage(parsed.name, url, false);
                    } else if (parsed.type === 'voice') {
                        const blob = base64ToBlob(parsed.data, 'audio/wav');
                        const url = URL.createObjectURL(blob);
                        addVoiceMessage(url, false);
                    }
                } catch (e) {
                    addMessage(data, false);
                }
            });

            conn.on('close', () => {
                disconnect();
                addSystemMessage('Собеседник разорвал соединение');
            });
        }

        function disconnect() {
            if (currentConn) {
                currentConn.close();
                currentConn = null;
            }
            connStatus.textContent = '⛔ Не подключено';
            connStatus.className = 'px-2.5 py-1 rounded-md bg-red-500/20 text-red-400 border border-red-500/30';
            connectBtn.classList.remove('hidden');
            disconnectBtn.classList.add('hidden');
            remoteInput.disabled = false;
            if (currentCall) endCall();
        }

        function sendText(text) {
            if (!currentConn) return addSystemMessage('Ошибка: нет активного P2P соединения');
            const payload = JSON.stringify({ type: 'text', text });
            currentConn.send(payload);
            addMessage(text, true);
        }

        function sendFile(file) {
            if (!currentConn) return;
            const reader = new FileReader();
            reader.onload = () => {
                const base64 = reader.result.split(',')[1];
                const payload = JSON.stringify({ type: 'file', name: file.name, mimeType: file.type, data: base64 });
                currentConn.send(payload);
                addFileMessage(file.name, null, true);
            };
            reader.readAsDataURL(file);
        }

        function sendVoice(blob) {
            if (!currentConn) return;
            const reader = new FileReader();
            reader.onload = () => {
                const base64 = reader.result.split(',')[1];
                const payload = JSON.stringify({ type: 'voice', data: base64 });
                currentConn.send(payload);
                const url = URL.createObjectURL(blob);
                addVoiceMessage(url, true);
            };
            reader.readAsDataURL(blob);
        }

        function addMessage(text, self) {
            const div = document.createElement('div');
            div.className = 'message text-xs ' + (self ? 'self' : '');
            div.innerHTML = escapeHtml(text) + `<span class="text-[9px] opacity-60 mt-1 block text-right font-mono">${new Date().toLocaleTimeString()}</span>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addFileMessage(name, url, self) {
            const div = document.createElement('div');
            div.className = 'message text-xs ' + (self ? 'self' : '');
            div.innerHTML = `
                <div class="flex items-center gap-2">
                    <span>📎 ${escapeHtml(name)}</span>
                    ${url ? `<a href="${url}" download="${escapeHtml(name)}" class="text-orange-400 ml-2 underline">Скачать</a>` : ''}
                </div>
                <span class="text-[9px] opacity-60 mt-1 block text-right font-mono">${new Date().toLocaleTimeString()}</span>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addVoiceMessage(url, self) {
            const div = document.createElement('div');
            div.className = 'message text-xs ' + (self ? 'self' : '');
            div.innerHTML = `
                <div class="flex items-center gap-2">
                    <span>🎤 Голосовое</span>
                    <audio controls src="${url}" class="h-8 max-w-[160px]"></audio>
                </div>
                <span class="text-[9px] opacity-60 mt-1 block text-right font-mono">${new Date().toLocaleTimeString()}</span>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'self-center bg-white/5 text-gray-400 text-[10px] rounded-full px-3 py-1 my-2 font-mono';
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function base64ToBlob(base64, mimeType) {
            const binary = atob(base64);
            const array = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) array[i] = binary.charCodeAt(i);
            return new Blob([array], { type: mimeType });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        connectBtn.addEventListener('click', () => {
            const remoteId = remoteInput.value.trim();
            if (!remoteId || remoteId === myId) return addSystemMessage('Укажите корректный ID собеседника');
            const conn = peer.connect(remoteId);
            if (conn) setupConnection(conn);
        });

        disconnectBtn.addEventListener('click', disconnect);

        sendBtn.addEventListener('click', () => {
            const text = msgInput.value.trim();
            if (text) {
                sendText(text);
                msgInput.value = '';
            }
        });

        msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });

        fileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            for (const file of fileInput.files) sendFile(file);
            fileInput.value = '';
        });

        // Запись голосовых
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;

        voiceBtn.addEventListener('mousedown', startRecording);
        voiceBtn.addEventListener('mouseup', stopRecording);
        voiceBtn.addEventListener('touchstart', startRecording, { passive: true });
        voiceBtn.addEventListener('touchend', stopRecording, { passive: true });

        function startRecording(e) {
            e.preventDefault();
            if (isRecording || !currentConn) return;
            navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];
                mediaRecorder.ondataavailable = ev => { if (ev.data.size > 0) recordedChunks.push(ev.data); };
                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/wav' });
                    sendVoice(blob);
                    stream.getTracks().forEach(t => t.stop());
                    isRecording = false;
                    voiceBtn.classList.remove('recording');
                };
                mediaRecorder.start();
                isRecording = true;
                voiceBtn.classList.add('recording');
                addSystemMessage('🎙 Запись голоса началась...');
            }).catch(e => alert('Ошибка микрофона: ' + e.message));
        }

        function stopRecording(e) {
            e.preventDefault();
            if (mediaRecorder && isRecording) mediaRecorder.stop();
        }

        // Звонки
        async function startCall(video) {
            if (!currentConn) return addSystemMessage('Сначала установите соединение с чатом');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video });
                localStream = stream;
                localVideo.srcObject = stream;
                
                const call = peer.call(currentConn.peer, stream, { metadata: { type: video ? 'video' : 'audio' } });
                call.on('stream', (remote) => {
                    remoteStream = remote;
                    remoteVideo.srcObject = remote;
                });
                call.on('close', () => endCall());
                currentCall = call;

                callOverlay.classList.remove('hidden');
                callOverlay.classList.add('flex');
                acceptCallBtn.classList.add('hidden');
                endCallBtn.textContent = 'Завершить';
            } catch (e) {
                alert('Ошибка медиа-устройств: ' + e.message);
            }
        }

        function endCall() {
            if (currentCall) { currentCall.close(); currentCall = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            if (remoteStream) { remoteStream.getTracks().forEach(t => t.stop()); remoteStream = null; }
            remoteVideo.srcObject = null;
            localVideo.srcObject = null;
            callOverlay.classList.remove('flex');
            callOverlay.classList.add('hidden');
            endCallBtn.textContent = 'Завершить';
        }

        callAudioBtn.addEventListener('click', () => startCall(false));
        callVideoBtn.addEventListener('click', () => startCall(true));
        endCallBtn.addEventListener('click', endCall);
    </script>
</body>
</html>
