<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#0c0d10;color:#DCC9A9;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(120deg,rgba(12,13,16,.94),rgba(12,13,16,.82)),url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=2000&auto=format&fit=crop") center/cover;z-index:-1}
.glass-app{background:rgba(22,23,28,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(220,201,169,.12);box-shadow:0 30px 60px rgba(0,0,0,.7)}
.glass-sidebar,.glass-card{background:rgba(15,16,20,.72);border:1px solid rgba(220,201,169,.09)}
.glass-input{background:rgba(0,0,0,.4);border:1px solid rgba(220,201,169,.15);color:#DCC9A9}
.glass-input:focus{outline:none;border-color:#DCC9A9}
.btn-red{background:#B83A2D;color:#fff}.btn-green{background:#4E6851;color:#DCC9A9}
button:disabled{opacity:.45;cursor:not-allowed}.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.status-dot.online{background:#4ade80;box-shadow:0 0 8px #4ade8080}.status-dot.connecting{background:#fbbf24;animation:pulse 1s infinite}.status-dot.offline{background:#6b7280}.status-dot.error{background:#f87171}
#send-btn.status-online{background:#4E6851}#send-btn.status-connecting{background:#9a7a2d}#send-btn.status-offline,#send-btn.status-error{background:#B83A2D}
.message{max-width:min(78%,680px);padding:10px 12px;border-radius:16px;background:rgba(220,201,169,.06);border:1px solid rgba(220,201,169,.08);animation:msgIn .18s ease}
.message.self{align-self:flex-end;background:#B83A2D;color:#fff;border:none}.message audio{width:260px;max-width:100%}.message video{max-width:300px;max-height:320px;border-radius:12px;background:#000}
.message-meta{display:block;text-align:right;font-size:9px;opacity:.6;margin-top:5px;font-family:monospace}
.file-card{display:flex;gap:8px;align-items:center;padding:9px;background:rgba(0,0,0,.2);border-radius:10px}
.toast-container{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:rgba(22,23,28,.96);border:1px solid rgba(220,201,169,.2);padding:10px 18px;border-radius:999px;box-shadow:0 8px 30px #0008;font-size:12px;max-width:90vw}
.toast.error{border-color:#f87171;color:#fca5a5}.toast.success{border-color:#4ade80;color:#86efac}
.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(12px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}.overlay{display:none}
@keyframes pulse{50%{opacity:.4}}@keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:767px){
 body{padding:0}.glass-app{border-radius:0!important;width:100%;height:100%}
 .desktop-nav{display:none!important}.mobile-menu{display:flex!important}
 .contacts-panel{position:absolute;z-index:30;left:0;top:0;bottom:0;width:min(86vw,340px);transform:translateX(-105%);box-shadow:20px 0 40px #0008;transition:transform .22s ease}
 .contacts-panel.open{transform:translateX(0)}.overlay.open{display:block;position:fixed;inset:0;background:#0008;z-index:20}
 .message{max-width:90%}.chat-actions button{padding:7px 8px;font-size:11px}
 .header-tools{width:100%}.header-tools input{flex:1;min-width:100px}.input-row{gap:6px!important;padding:8px!important}
 .input-row button{min-width:40px}.input-row textarea{min-width:0}
}
@media(min-width:768px){.mobile-menu{display:none!important}}
</style>

<script>
/*
  Tapi-Tap Native WebRTC Edition
  --------------------------------
  Замена PeerJS:
    - WebSocket/WSS signaling
    - RTCPeerConnection
    - RTCDataChannel
    - MediaStream для звонков
    - STUN/TURN через конфигурацию ICE
  IndexedDB и существующий UI/модель данных сохранены.
  Для production укажите собственный signaling URL и TURN.
*/
(()=>{'use strict';
const $=s=>document.querySelector(s), now=()=>Date.now();
const DB='TapiTapDB', VER=11, CHUNK=16*1024, MAX_MEDIA=30*1000;
const DEFAULT_STUN=['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.cloudflare.com:3478'];
let db=null, dbReady=false, mediaRecorder=null, mediaStream=null, videoRecorder=null, videoStream=null, videoChunks=[], audioChunks=[], videoTimer=null, incomingConn=null, pendingDelete=null;

function getStoredId(){
 let id=localStorage.getItem('tapi_tap_persistent_id');
 if(!id){const phone=prompt('Введите ваш номер телефона (будет использоваться как ID):','');id=phone?.trim()||('user-'+Date.now());localStorage.setItem('tapi_tap_persistent_id',id)}
 return id;
}
const state={
 myId:getStoredId(),myNickname:localStorage.getItem('tapi_my_nickname')||'Мой профиль',
 contacts:new Map(),connections:new Map(),auth:new Map(),active:null,urls:[],
 pendingTransfers:new Map(),identityKeys:null,call:null,reconnect:new Map(),
 ws:null,wsReady:false,manualClose:false,callPeers:new Map(),pendingSignals:new Map()
};
const NET={
 signalingUrl:localStorage.getItem('tapi_signaling_url')||'',
 stun:JSON.parse(localStorage.getItem('tapi_stun')||JSON.stringify(DEFAULT_STUN)),
 turnUrl:localStorage.getItem('tapi_turn_url')||'',
 turnUser:localStorage.getItem('tapi_turn_user')||'',
 turnPass:localStorage.getItem('tapi_turn_pass')||''
};
$('#nickname').value=state.myNickname;$('#profile-id').textContent=state.myId;
$('#signaling-url').value=NET.signalingUrl;$('#stun-list').value=NET.stun.join('\n');$('#turn-url').value=NET.turnUrl;$('#turn-user').value=NET.turnUser;$('#turn-pass').value=NET.turnPass;

function uid(){return crypto.randomUUID?crypto.randomUUID():'tapi-'+Date.now()+'-'+Math.random().toString(36).slice(2)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t,type='info'){const e=document.createElement('div');e.className='toast '+type;e.textContent=t;$('#toast-container').appendChild(e);setTimeout(()=>e.remove(),3500)}
function setStatus(s,t){$('#peer-dot').className='status-dot '+s;$('#peer-text').textContent=t}
function setChatStatus(s,t){$('#chat-dot').className='status-dot '+s;$('#chat-status').textContent=t;const b=$('#send-btn');b.classList.remove('status-online','status-connecting','status-offline','status-error');b.classList.add('status-'+s)}
function switchTab(t){['chat','settings'].forEach(x=>{$('#tab-'+x).classList.toggle('hidden',x!==t);$('#tab-'+x).classList.toggle('flex',x===t)})}
window.switchTab=switchTab;
function toggleDrawer(v){$('#contacts-panel').classList.toggle('open',v);$('#drawer-overlay').classList.toggle('open',v)}
window.toggleDrawer=toggleDrawer;

function tx(store,mode,fn){return new Promise((res,rej)=>{try{const t=db.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=()=>res(r);t.onerror=()=>rej(t.error||Error('IndexedDB error'));t.onabort=()=>rej(t.error||Error('IndexedDB abort'))}catch(e){rej(e)}})}
function req(store,method,key){return new Promise((res,rej)=>{const r=db.transaction(store,'readonly').objectStore(store)[method](key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,VER);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('contacts')){const s=d.createObjectStore('contacts',{keyPath:'id'});s.createIndex('contactUid','contactUid',{unique:false})}else{const s=e.target.transaction.objectStore('contacts');if(!s.indexNames.contains('contactUid'))s.createIndex('contactUid','contactUid',{unique:false})}if(!d.objectStoreNames.contains('messages')){const s=d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});s.createIndex('peerId','peerId');s.createIndex('contactUid','contactUid');s.createIndex('time','time')}else{const s=e.target.transaction.objectStore('messages');if(!s.indexNames.contains('contactUid'))s.createIndex('contactUid','contactUid');if(!s.indexNames.contains('peerId'))s.createIndex('peerId','peerId')}if(!d.objectStoreNames.contains('drafts'))d.createObjectStore('drafts',{keyPath:'contactUid'});if(!d.objectStoreNames.contains('pending'))d.createObjectStore('pending',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;dbReady=true;res(db)};r.onerror=()=>rej(r.error)})}
async function loadData(){(await req('contacts','getAll')).forEach(c=>state.contacts.set(c.id,c));renderContacts()}
async function saveContact(c){await tx('contacts','readwrite',s=>s.put(c));state.contacts.set(c.id,c)}
async function contactByUid(u){return [...state.contacts.values()].find(c=>c.contactUid===u)}
async function saveMessage(peerId,contactUid,text,sent,file=null,system=false){await tx('messages','readwrite',s=>s.add({peerId,contactUid,text:text||'',sent:!!sent,file,time:now(),system}))}
async function messagesFor(cuid){return(await req('messages','getAll')).filter(m=>m.contactUid===cuid).sort((a,b)=>a.time-b.time)}
async function clearHistory(cuid){await tx('messages','readwrite',s=>{const r=s.openCursor();r.onsuccess=()=>{const c=r.result;if(!c)return;if(c.value.contactUid===cuid)c.delete();c.continue()}})}
async function saveDraft(cuid,text){await tx('drafts','readwrite',s=>s.put({contactUid:cuid,text}))}
async function getDraft(cuid){return(await req('drafts','get',cuid))?.text||''}

async function keys(){
 const raw=localStorage.getItem('tapi_identity_jwk');
 if(raw){try{const x=JSON.parse(raw);return{privateKey:await crypto.subtle.importKey('jwk',x.privateKey,{name:'ECDH',namedCurve:'P-256'},true,['deriveKey','deriveBits']),publicKey:await crypto.subtle.importKey('jwk',x.publicKey,{name:'ECDH',namedCurve:'P-256'},true,[])}}catch{}}
 const k=await crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey','deriveBits']);
 const privateKey=await crypto.subtle.exportKey('jwk',k.privateKey),publicKey=await crypto.subtle.exportKey('jwk',k.publicKey);
 localStorage.setItem('tapi_identity_jwk',JSON.stringify({privateKey,publicKey}));
 return k;
}
async function derive(remote){return crypto.subtle.deriveKey({name:'ECDH',public:remote},state.identityKeys.privateKey,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function enc(key,data){const iv=crypto.getRandomValues(new Uint8Array(12));const b=typeof data==='string'?new TextEncoder().encode(data):new Uint8Array(data);return{iv,data:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,b)}}
async function dec(key,o){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:o.iv},key,o.data))}

function iceServers(){const a=NET.stun.filter(Boolean).map(urls=>({urls}));if(NET.turnUrl)a.push({urls:NET.turnUrl,username:NET.turnUser,credential:NET.turnPass});return a}
function rtcConfig(){return{iceServers:iceServers(),bundlePolicy:'max-bundle',rtcpMuxPolicy:'require'}}
function sendSignal(to,payload){if(!state.wsReady||!state.ws)return false;try{state.ws.send(JSON.stringify({type:'signal',from:state.myId,to,payload}));return true}catch{return false}}

function connectSignaling(){
 if(!NET.signalingUrl){setStatus('error','Нужен signaling URL');toast('Укажите WSS signaling URL в Настройках','error');return}
 if(state.ws&&(state.ws.readyState===WebSocket.OPEN||state.ws.readyState===WebSocket.CONNECTING))return;
 setStatus('connecting','Подключение signaling');
 try{state.ws=new WebSocket(NET.signalingUrl)}catch(e){setStatus('error','Ошибка signaling');return}
 state.ws.onopen=()=>{state.wsReady=true;setStatus('online','Signaling готов');state.ws.send(JSON.stringify({type:'register',id:state.myId,nickname:state.myNickname}));for(const c of state.contacts.values())if(c.id!==state.myId)connectToPeer(c.id)}
 state.ws.onmessage=async e=>{try{const m=JSON.parse(e.data);if(m.type==='registered'){setStatus('online','P2P готов')}else if(m.type==='signal')await handleSignal(m.from,m.payload)}catch(err){console.error(err)}}
 state.ws.onerror=()=>{state.wsReady=false;setStatus('error','Ошибка signaling')}
 state.ws.onclose=()=>{state.wsReady=false;if(!state.manualClose){setStatus('connecting','Повтор signaling');setTimeout(connectSignaling,3000)}}
}

function makeConn(id,initiator){
 let old=state.connections.get(id);if(old&&old.pc&&old.pc.signalingState!=='closed')return old;
 const pc=new RTCPeerConnection(rtcConfig());
 const conn={id,pc,dc:null,open:false,initiator,queued:[],makingOffer:false,ignoreOffer:false,polite:state.myId<id};
 state.connections.set(id,conn);
 pc.onicecandidate=e=>{if(e.candidate)sendSignal(id,{kind:'ice',candidate:e.candidate})};
 pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected'){conn.open=true;setChatStatus('online','P2P + E2EE защищено');renderContacts()}else if(s==='failed'){setChatStatus('error','P2P ошибка');scheduleReconnect(id)}else if(s==='disconnected'){setChatStatus('connecting','Переподключение P2P')}else if(s==='closed'){conn.open=false;renderContacts()}};
 pc.ondatachannel=e=>setupDataChannel(conn,e.channel);
 pc.onnegotiationneeded=async()=>{if(!conn.initiator)return;try{conn.makingOffer=true;await pc.setLocalDescription();sendSignal(id,{kind:'sdp',description:pc.localDescription})}catch(e){console.error(e)}finally{conn.makingOffer=false}};
 if(initiator)setupDataChannel(conn,pc.createDataChannel('tapi-data',{ordered:true,maxRetransmits:null}));
 return conn;
}
function setupDataChannel(conn,dc){if(conn.dc===dc)return;conn.dc=dc;dc.binaryType='arraybuffer';dc.bufferedAmountLowThreshold=64*1024;dc.onopen=async()=>{conn.open=true;await handshake(conn);for(const x of conn.queued)try{dc.send(x)}catch{}conn.queued=[];renderContacts();if(state.active===conn.id)setChatStatus('online','P2P + E2EE защищено')};dc.onclose=()=>{conn.open=false;renderContacts();if(state.active===conn.id)setChatStatus('offline','Нет соединения');scheduleReconnect(conn.id)};dc.onerror=()=>{if(state.active===conn.id)setChatStatus('error','Ошибка DataChannel')};dc.onmessage=e=>handleData(conn.id,conn,e.data)}
function sendRaw(conn,data){if(!conn)return false;if(!conn.dc||conn.dc.readyState!=='open'){if(data instanceof ArrayBuffer||data instanceof Uint8Array)conn.queued.push(data);return false}try{conn.dc.send(data);return true}catch{return false}}
async function handshake(conn){const pub=await crypto.subtle.exportKey('jwk',state.identityKeys.publicKey);sendRaw(conn,{type:'auth_hello',pub,nickname:state.myNickname,contactUid:state.contacts.get(conn.id)?.contactUid||null,messageId:uid(),timestamp:now()})}

async function connectToPeer(id){
 if(!id||id===state.myId)return;
 if(!state.wsReady){connectSignaling();setChatStatus('connecting','Ожидание signaling');return}
 const old=state.connections.get(id);if(old?.open)return;
 setChatStatus('connecting','Установка P2P');
 const c=makeConn(id,true);
 try{c.makingOffer=true;await c.pc.setLocalDescription();sendSignal(id,{kind:'sdp',description:c.pc.localDescription})}catch(e){console.error(e);scheduleReconnect(id)}finally{c.makingOffer=false}
}
async function handleSignal(from,p){
 const c=makeConn(from,false),pc=c.pc;
 try{
  if(p.kind==='sdp'){
   const offer=p.description.type==='offer';
   const collision=offer&&(c.makingOffer||pc.signalingState!=='stable');
   c.ignoreOffer=!c.polite&&collision;if(c.ignoreOffer)return;
   await pc.setRemoteDescription(p.description);
   if(offer){await pc.setLocalDescription();sendSignal(from,{kind:'sdp',description:pc.localDescription})}
  }else if(p.kind==='ice'){try{await pc.addIceCandidate(p.candidate)}catch(e){if(!c.ignoreOffer)throw e}}
 }catch(e){console.error('Signal error',e);scheduleReconnect(from)}
}
function scheduleReconnect(id){if(state.reconnect.has(id))return;const n=(state.reconnect.get(id)?.attempts||0)+1;const delay=Math.min(60000,2000*Math.pow(1.7,n-1));const timer=setTimeout(()=>{state.reconnect.delete(id);const c=state.connections.get(id);try{c?.pc.close()}catch{}state.connections.delete(id);connectToPeer(id)},delay);state.reconnect.set(id,{timer,attempts:n})}

async function renderContacts(){
 const a=[...state.contacts.values()];$('#contacts-count').textContent=a.length;
 $('#contacts-list').innerHTML=a.length?a.map(c=>{const on=state.connections.get(c.id)?.open;return `<div class="contact-row p-2 rounded-xl hover:bg-white/5 flex items-center gap-2" data-id="${esc(c.id)}"><div class="w-8 h-8 rounded-full bg-[#4E6851]/30 flex items-center justify-center text-xs">👤</div><div class="min-w-0 flex-1"><b class="text-xs truncate block">${esc(c.name||c.remoteNickname||c.id)}</b><span class="text-[9px] text-gray-500">${on?'🟢 в сети':'⚪ офлайн'}</span></div><button class="rename-contact text-xs" data-id="${esc(c.id)}">✏️</button><button class="copy-contact text-xs" data-id="${esc(c.id)}">📋</button></div>`}).join(''):'<div class="text-xs text-gray-500 text-center p-4">Нет контактов</div>';
 document.querySelectorAll('.contact-row').forEach(e=>e.onclick=()=>openChat(e.dataset.id));
 document.querySelectorAll('.rename-contact').forEach(e=>e.onclick=x=>{x.stopPropagation();renameContact(e.dataset.id)});
 document.querySelectorAll('.copy-contact').forEach(e=>e.onclick=x=>{x.stopPropagation();navigator.clipboard?.writeText(e.dataset.id);toast('Номер скопирован','success')})
}
async function renameContact(id){const c=state.contacts.get(id);if(!c)return;const n=prompt('Новое имя контакта:',c.name||c.remoteNickname||id);if(!n?.trim())return;c.name=n.trim();c.updatedAt=now();await saveContact(c);renderContacts();if(state.active===id)$('#chat-name').textContent=c.name}
async function openChat(id){const c=state.contacts.get(id);if(!c)return;if(state.active&&state.active!==id){const p=state.contacts.get(state.active);if(p)await saveDraft(p.contactUid,$('#msg-input').value)}state.active=id;$('#chat-name').textContent=c.name||c.remoteNickname||id;$('#msg-input').value=await getDraft(c.contactUid);toggleDrawer(false);const co=state.connections.get(id);if(co?.open&&state.auth.get(id)?.authorized)setChatStatus('online','P2P + E2EE защищено');else{setChatStatus('connecting','Подключение');connectToPeer(id)}await renderMessages()}
async function renderMessages(){state.urls.forEach(URL.revokeObjectURL);state.urls=[];const c=state.contacts.get(state.active);$('#chat-container').innerHTML='';if(!c)return;for(const m of await messagesFor(c.contactUid)){const d=document.createElement('div');d.className='message '+(m.sent?'self':'');if(m.system)d.innerHTML='<span class="text-xs opacity-70">ℹ️ '+esc(m.text)+'</span>';else if(m.file){const u=URL.createObjectURL(m.file.blob);state.urls.push(u);if(m.file.mediaType==='audio')d.innerHTML=`<audio controls src="${u}"></audio>`;else if(m.file.mediaType==='video')d.innerHTML=`<video controls playsinline src="${u}"></video>`;else d.innerHTML=`<div class="file-card"><span>📎</span><a href="${u}" download="${esc(m.file.name)}">${esc(m.file.name)}</a><small>${Math.round((m.file.size||0)/1024)} KB</small></div>`}else d.textContent=m.text;const meta=document.createElement('span');meta.className='message-meta';meta.textContent=new Date(m.time).toLocaleTimeString();d.appendChild(meta);$('#chat-container').appendChild(d)}$('#chat-container').scrollTop=$('#chat-container').scrollHeight}

async function handleData(id,conn,m){
 if(m instanceof ArrayBuffer){return}
 if(typeof m!=='object'||!m)return;
 if(m.type==='auth_hello'){try{const remote=await crypto.subtle.importKey('jwk',m.pub,{name:'ECDH',namedCurve:'P-256'},true,[]);const key=await derive(remote);state.auth.set(id,{authorized:false,aesKey:key,remoteNickname:m.nickname||id});let c=state.contacts.get(id);if(!c){incomingConn=conn;$('#incoming-nick').textContent=m.nickname||id;$('#incoming-name').value=m.nickname||id;$('#incoming-modal').classList.add('open')}else{state.auth.get(id).authorized=true;sendRaw(conn,{type:'auth_accept',messageId:uid()});if(c.remoteNickname!==m.nickname){c.remoteNickname=m.nickname||id;await saveContact(c)}if(state.active===id)setChatStatus('online','P2P + E2EE защищено');renderContacts()}}catch(e){console.error(e)}return}
 if(m.type==='auth_accept'){const a=state.auth.get(id);if(a)a.authorized=true;if(state.active===id)setChatStatus('online','P2P + E2EE защищено');return}
 if(m.type==='auth_reject'){toast('Запрос на подключение отклонён','error');try{conn.pc.close()}catch{}return}
 if(m.type==='text'){const a=state.auth.get(id);if(!a?.authorized)return;try{const b=await dec(a.aesKey,{iv:new Uint8Array(m.iv),data:base64ToBuf(m.data)});const text=new TextDecoder().decode(b);const c=state.contacts.get(id);if(c){await saveMessage(id,c.contactUid,text,false);if(state.active===id)renderMessages()}}catch(e){console.warn(e)}return}
 if(m.type==='media_start'){state.pendingTransfers.set(m.transferId,{...m,parts:[]});return}
 if(m.type==='media_chunk'){const t=state.pendingTransfers.get(m.transferId);const a=state.auth.get(id);if(!t||!a?.authorized)return;try{const b=await dec(a.aesKey,{iv:new Uint8Array(m.iv),data:base64ToBuf(m.data)});t.parts[m.index]=b}catch(e){console.warn(e)}return}
 if(m.type==='media_end'){const t=state.pendingTransfers.get(m.transferId),c=state.contacts.get(id);if(!t||!c)return;try{const blob=new Blob(t.parts,{type:t.mime});await saveMessage(id,c.contactUid,'',false,{name:t.name,mime:t.mime,mediaType:t.mediaType,size:t.size,blob});if(state.active===id)renderMessages()}catch(e){toast('Ошибка получения медиа','error')}state.pendingTransfers.delete(m.transferId);return}
 if(m.type==='delete_history_request')return handleDelete(id,m);
 if(m.type==='delete_history_accept'||m.type==='delete_history_execute'||m.type==='delete_history_reject')return handleDelete(id,m);
 if(m.type==='call_offer'||m.type==='call_answer'||m.type==='call_ice'||m.type==='call_end')return handleCallSignal(id,m);
}
function bufToBase64(b){let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)}
function base64ToBuf(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}

async function sendText(){const text=$('#msg-input').value.trim(),c=state.contacts.get(state.active);if(!text||!c)return;const co=state.connections.get(state.active),a=state.auth.get(state.active);if(!co?.open||!a?.authorized){connectToPeer(state.active);return}try{const x=await enc(a.aesKey,text);if(sendRaw(co,{type:'text',iv:Array.from(x.iv),data:bufToBase64(x.data)})){await saveMessage(state.active,c.contactUid,text,true);$('#msg-input').value='';renderMessages()}}catch(e){toast('Ошибка отправки','error')}}
async function sendMedia(blob,mediaType,name){const c=state.contacts.get(state.active),co=state.connections.get(state.active),a=state.auth.get(state.active);if(!c||!co?.open||!a?.authorized)return toast('Нет защищённого соединения','error');const transferId=uid(),bytes=new Uint8Array(await blob.arrayBuffer()),total=Math.ceil(bytes.length/CHUNK);sendRaw(co,{type:'media_start',transferId,name,mime:blob.type,mediaType,size:bytes.length,totalChunks:total});for(let i=0;i<total;i++){const x=await enc(a.aesKey,bytes.slice(i*CHUNK,(i+1)*CHUNK));if(!sendRaw(co,{type:'media_chunk',transferId,index:i,iv:Array.from(x.iv),data:bufToBase64(x.data)}))return toast('Передача прервана','error');await new Promise(r=>setTimeout(r,0))}sendRaw(co,{type:'media_end',transferId});await saveMessage(state.active,c.contactUid,'',true,{name,mime:blob.type,mediaType,size:bytes.length,blob});renderMessages()}
function chooseMime(list){return list.find(x=>MediaRecorder.isTypeSupported(x))||''}
async function startVoice(){if(mediaRecorder?.state==='recording'){mediaRecorder.stop();return}if(!state.active)return toast('Выберите контакт','error');try{mediaStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});const mime=chooseMime(['audio/webm;codecs=opus','audio/webm','audio/mp4']);mediaRecorder=new MediaRecorder(mediaStream,mime?{mimeType:mime}:undefined);audioChunks=[];mediaRecorder.ondataavailable=e=>e.data.size&&audioChunks.push(e.data);mediaRecorder.onstop=async()=>{try{await sendMedia(new Blob(audioChunks,{type:mime||'audio/webm'}),'audio','audio-msg-'+Date.now()+'.webm')}finally{cleanupVoice()}};mediaRecorder.start(500);$('#voice-btn').textContent='⏹';setTimeout(()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()},MAX_MEDIA)}catch{toast('Нет доступа к микрофону','error');cleanupVoice()}}
function cleanupVoice(){try{mediaStream?.getTracks().forEach(t=>t.stop())}catch{}mediaStream=null;mediaRecorder=null;audioChunks=[];$('#voice-btn').textContent='🎤'}
async function openVideoRecorder(){if(!state.active)return toast('Выберите контакт','error');try{videoStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});$('#preview').srcObject=videoStream;$('#video-modal').classList.add('open')}catch{toast('Нет доступа к камере и микрофону','error')}}
function closeVideo(){clearTimeout(videoTimer);try{videoRecorder?.stop()}catch{}try{videoStream?.getTracks().forEach(t=>t.stop())}catch{}videoRecorder=null;videoStream=null;videoChunks=[];$('#preview').srcObject=null;$('#video-modal').classList.remove('open');$('#record-video').textContent='🔴 Запись 30с'}
function recordVideo(){if(videoRecorder?.state==='recording'){videoRecorder.stop();return}const mime=chooseMime(['video/webm;codecs=vp8,opus','video/webm']);try{videoChunks=[];videoRecorder=new MediaRecorder(videoStream,mime?{mimeType:mime}:undefined);videoRecorder.ondataavailable=e=>e.data.size&&videoChunks.push(e.data);videoRecorder.onstop=async()=>{try{await sendMedia(new Blob(videoChunks,{type:mime||'video/webm'}),'video','video-msg-'+Date.now()+'.webm')}finally{closeVideo()}};videoRecorder.start(500);$('#record-video').textContent='⏹ Остановить';videoTimer=setTimeout(()=>{if(videoRecorder?.state==='recording')videoRecorder.stop()},MAX_MEDIA)}catch{toast('Браузер не поддерживает видеозапись','error')}}

async function handleDelete(id,m){const c=state.contacts.get(id);if(!c)return;if(m.type==='delete_history_request'){pendingDelete={id,requestId:m.requestId,cuid:c.contactUid};$('#delete-question').textContent=`Пользователь «${c.name||id}» запрашивает удаление всей истории этого чата. Согласны?`;$(`#delete-modal`).classList.add('open');$('#delete-accept').onclick=async()=>{sendRaw(state.connections.get(id),{type:'delete_history_accept',requestId:m.requestId});await clearHistory(c.contactUid);closeDeleteModal();await saveMessage(id,c.contactUid,'История чата удалена по обоюдному согласию',false,null,true);renderMessages()};$('#delete-reject').onclick=()=>{sendRaw(state.connections.get(id),{type:'delete_history_reject',requestId:m.requestId});closeDeleteModal()};return}if(m.type==='delete_history_accept'){await clearHistory(c.contactUid);sendRaw(state.connections.get(id),{type:'delete_history_execute',requestId:m.requestId});await saveMessage(id,c.contactUid,'История чата удалена по обоюдному согласию',false,null,true);if(state.active===id)renderMessages();return}if(m.type==='delete_history_execute'){await clearHistory(c.contactUid);await saveMessage(id,c.contactUid,'История чата удалена по обоюдному согласию',false,null,true);if(state.active===id)renderMessages();return}if(m.type==='delete_history_reject')toast('Собеседник отказался удалять историю','error')}
function requestDelete(){const c=state.contacts.get(state.active),co=state.connections.get(state.active);if(!c||!co?.open)return toast('Нет соединения','error');if(confirm('Запросить удаление всей истории этого чата у обоих участников?'))sendRaw(co,{type:'delete_history_request',requestId:uid(),contactUid:c.contactUid,timestamp:now()})}
function closeDeleteModal(){$('#delete-modal').classList.remove('open');pendingDelete=null}
window.closeDeleteModal=closeDeleteModal;
function rejectIncoming(){if(incomingConn)sendRaw(incomingConn,{type:'auth_reject'});incomingConn=null;$('#incoming-modal').classList.remove('open')}
async function acceptIncoming(){if(!incomingConn)return;const id=incomingConn.id,n=$('#incoming-name').value.trim()||$('#incoming-nick').textContent;const c={id,contactUid:uid(),name:n,remoteNickname:$('#incoming-nick').textContent,createdAt:now()};await saveContact(c);const a=state.auth.get(id);if(a)a.authorized=true;sendRaw(incomingConn,{type:'auth_accept'});$('#incoming-modal').classList.remove('open');incomingConn=null;renderContacts();openChat(id)}
window.rejectIncoming=rejectIncoming;window.acceptIncoming=acceptIncoming;

function saveNickname(){const n=$('#nickname').value.trim();if(!n)return;state.myNickname=n;localStorage.setItem('tapi_my_nickname',n);toast('Имя сохранено','success')}
window.saveNickname=saveNickname;
function copyMyId(){navigator.clipboard?.writeText(state.myId);toast('Номер скопирован','success')}window.copyMyId=copyMyId;
async function clearDatabase(){if(!confirm('Удалить локальные контакты и историю?'))return;db.close();indexedDB.deleteDatabase(DB);location.reload()}
function saveNetworkSettings(){NET.signalingUrl=$('#signaling-url').value.trim();NET.stun=$('#stun-list').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);NET.turnUrl=$('#turn-url').value.trim();NET.turnUser=$('#turn-user').value.trim();NET.turnPass=$('#turn-pass').value;localStorage.setItem('tapi_signaling_url',NET.signalingUrl);localStorage.setItem('tapi_stun',JSON.stringify(NET.stun));localStorage.setItem('tapi_turn_url',NET.turnUrl);localStorage.setItem('tapi_turn_user',NET.turnUser);localStorage.setItem('tapi_turn_pass',NET.turnPass);toast('Сетевые настройки сохранены','success');if(state.ws){state.manualClose=true;state.ws.close();state.manualClose=false}connectSignaling()}
window.saveNetworkSettings=saveNetworkSettings;

async function changePeerId(){const newId=$('#new-peer-id').value.trim();if(!newId)return toast('Введите номер','error');if(newId===state.myId)return toast('Номер совпадает с текущим','error');if(!confirm('Сменить номер? Контакты будут уведомлены.'))return;const oldId=state.myId;const contacts=[...state.contacts.values()];for(const c of state.connections.values())try{c.pc.close()}catch{}state.connections.clear();state.auth.clear();state.myId=newId;localStorage.setItem('tapi_tap_persistent_id',newId);$('#profile-id').textContent=newId;for(const c of contacts){if(c.id===oldId)continue}if(state.ws){state.manualClose=true;state.ws.close();state.manualClose=false}connectSignaling()}
window.changePeerId=changePeerId;

/* Native WebRTC audio/video calling. Signaling is carried by the same WSS channel. */
async function startCall(video){const id=state.active,co=state.connections.get(id);if(!id||!co?.open)return toast('Нет P2P соединения','error');try{const stream=await navigator.mediaDevices.getUserMedia({audio:true,video});const pc=new RTCPeerConnection(rtcConfig());state.call={id,pc,stream,initiator:true};stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>e.candidate&&sendSignal(id,{kind:'call',payload:{type:'call_ice',candidate:e.candidate}});pc.ontrack=e=>$('#remote-video').srcObject=e.streams[0];const offer=await pc.createOffer();await pc.setLocalDescription(offer);sendSignal(id,{kind:'call',payload:{type:'call_offer',description:pc.localDescription}});$('#local-video').srcObject=stream;$('#call-modal').classList.add('open')}catch(e){console.error(e);toast('Не удалось начать звонок','error')}}
async function handleCallSignal(id,m){if(m.type==='call_offer'){const pc=new RTCPeerConnection(rtcConfig());const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:true}).catch(()=>null);state.call={id,pc,stream,initiator:false};if(stream)stream.getTracks().forEach(t=>pc.addTrack(t,stream));pc.onicecandidate=e=>e.candidate&&sendSignal(id,{kind:'call',payload:{type:'call_ice',candidate:e.candidate}});pc.ontrack=e=>$('#remote-video').srcObject=e.streams[0];await pc.setRemoteDescription(m.description);const ans=await pc.createAnswer();await pc.setLocalDescription(ans);sendSignal(id,{kind:'call',payload:{type:'call_answer',description:pc.localDescription}});if(stream)$('#local-video').srcObject=stream;$('#call-modal').classList.add('open')}else if(m.type==='call_answer'&&state.call?.pc){await state.call.pc.setRemoteDescription(m.description)}else if(m.type==='call_ice'&&state.call?.pc){try{await state.call.pc.addIceCandidate(m.candidate)}catch(e){console.warn(e)}}else if(m.type==='call_end')endCall()}
function endCall(){try{if(state.call?.id)sendSignal(state.call.id,{kind:'call',payload:{type:'call_end'}})}catch{}try{state.call?.pc.close()}catch{}try{state.call?.stream?.getTracks().forEach(t=>t.stop())}catch{}$('#local-video').srcObject=null;$('#remote-video').srcObject=null;state.call=null;$('#call-modal').classList.remove('open')}

/* Route call signaling from WSS into call handler. */
const _handleSignal=handleSignal;
handleSignal=async function(from,p){if(p.kind==='call'){await handleCallSignal(from,p.payload);return}_handleSignal(from,p)};

$('#connect-btn').onclick=()=>{const id=$('#remote-id').value.trim();if(!id||id===state.myId)return;if(state.contacts.has(id))openChat(id);else{const c={id,contactUid:uid(),name:id,remoteNickname:id,createdAt:now()};saveContact(c).then(()=>{renderContacts();openChat(id)})}};
$('#send-btn').onclick=sendText;
$('#msg-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};
$('#msg-input').oninput=()=>{if(state.active){const c=state.contacts.get(state.active);if(c)saveDraft(c.contactUid,$('#msg-input').value)}};
$('#voice-btn').onclick=startVoice;$('#video-msg-btn').onclick=openVideoRecorder;$('#record-video').onclick=recordVideo;$('#cancel-video').onclick=closeVideo;
$('#file-btn').onclick=()=>$('#file-input').click();$('#file-input').onchange=async e=>{const f=e.target.files?.[0];if(f){if(f.size>15*1024*1024)return toast('Файл больше 15 МБ','error');await sendMedia(f,'file',f.name)}e.target.value=''};
$('#delete-history-btn').onclick=requestDelete;$('#rename-btn').onclick=()=>state.active&&renameContact(state.active);$('#copy-contact-id').onclick=()=>state.active&&navigator.clipboard?.writeText(state.active);
$('#audio-call').onclick=()=>startCall(false);$('#video-call').onclick=()=>startCall(true);$('#end-call').onclick=endCall;

async function boot(){try{await openDB();state.identityKeys=await keys();await loadData();connectSignaling()}catch(e){console.error(e);setStatus('error','Ошибка запуска');toast('Ошибка запуска приложения','error')}}
boot();
})();
</script>
